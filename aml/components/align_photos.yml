$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: parkwatch_align_photos
display_name: align_photos
description: Tracks the camera landmarks on the new photos (anchors from Label Studio) and extends the alignment table (parkwatch-alignment).
code: ../../ml
environment: azureml:parkwatch-data:4
is_deterministic: false  # depends on the new photos, the anchors and the latest registered table
inputs:
  rois:
    type: uri_file
  ls_url:
    type: string
  landmarks_project:
    type: integer
  keyvault_url:
    type: string
  asset_name:
    type: string
    default: parkwatch-alignment
  rebuild:
    type: boolean
    default: false  # true = track the whole history again
outputs:
  alignment:
    type: uri_folder
command: >-
  python align_photos.py
  --rois ${{inputs.rois}} --out ${{outputs.alignment}} --asset-name ${{inputs.asset_name}}
  --ls-url ${{inputs.ls_url}} --landmarks-project ${{inputs.landmarks_project}}
  --keyvault-url ${{inputs.keyvault_url}} --rebuild ${{inputs.rebuild}}
