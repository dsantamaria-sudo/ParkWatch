$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
type: command
name: parkwatch_train
display_name: train
description: ParkNet from scratch; day-grouped cross-validation (or epochs of the last run with CV) and final model.
code: ../../ml
environment: azureml:parkwatch-train:2
inputs:
  dataset:
    type: uri_folder
    mode: download
  run_cv:
    type: boolean
    default: true
  holdout_days:
    type: string
    optional: true  # "YYYY-MM-DD YYYY-MM-DD"; no value = no holdout yet
  exclude_days:
    type: string
    optional: true  # "YYYY-MM-DD ..." left out of training (experiments)
  holdout_eval:
    type: boolean
    default: true  # false (experiments): holdout kept out of training but not evaluated
  note:
    type: string
    optional: true  # experiment name (MLflow tag `experiment`, run name suffix)
  epochs:
    type: integer
    default: 40
  final_epochs:
    type: integer
    optional: true  # forces the epochs of the final model; with run_cv false, no CV at all
  width:
    type: number
    default: 1.0
  input_size:
    type: integer
    default: 96
  crop_margin:
    type: number
    default: 0.10
  jitter:
    type: number
    default: 0.0
  mask_channel:
    type: boolean
    default: false  # experiment B: spot polygon as a 4th input channel (needs rois)
  outside:
    type: string
    default: keep  # experiment C: grey = everything outside the spot polygon painted grey (needs rois)
  rois:
    type: uri_file
    optional: true  # rois.json of the dataset (with mask_channel / outside grey)
  mlflow_url:
    type: string
    optional: true  # self-hosted MLflow; no value = the job's Azure ML run
  keyvault_url:
    type: string
    optional: true  # Key Vault with the pipeline user's password (with mlflow_url)
outputs:
  model:
    type: uri_folder
command: >-
  python train.py
  --data-dir ${{inputs.dataset}} --output-dir ${{outputs.model}}
  --run-cv ${{inputs.run_cv}} --epochs ${{inputs.epochs}} $[[--final-epochs ${{inputs.final_epochs}}]]
  --width ${{inputs.width}} --input-size ${{inputs.input_size}}
  --crop-margin ${{inputs.crop_margin}} --jitter ${{inputs.jitter}}
  --mask-channel ${{inputs.mask_channel}} --outside ${{inputs.outside}} $[[--rois ${{inputs.rois}}]]
  $[[--holdout-days ${{inputs.holdout_days}}]] $[[--exclude-days ${{inputs.exclude_days}}]] --holdout-eval ${{inputs.holdout_eval}}
  $[[--note ${{inputs.note}}]]
  $[[--mlflow-url ${{inputs.mlflow_url}}]] $[[--keyvault-url ${{inputs.keyvault_url}}]]
