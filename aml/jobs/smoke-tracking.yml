$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# Smoke test of the self-hosted MLflow from a job (ml/smoke_tracking.py): Key Vault password,
# runs on the self-hosted server and the Azure ML registry in the same process.
# Runs on cpu-cluster (same identity and environment as promote).
# AZURE_CLIENT_ID (client id of parkwatch-identity) is passed at submission:
#   az ml job create -f aml/jobs/smoke-tracking.yml --set environment_variables.AZURE_CLIENT_ID=<id>
display_name: smoke-tracking
experiment_name: parkwatch-smoke
compute: azureml:cpu-cluster
environment: azureml:parkwatch-train:2
code: ../../ml
inputs:
  mlflow_url: https://parkwatch-mlflow.proudcliff-6d0c960a.spaincentral.azurecontainerapps.io
  keyvault_url: https://parkwatch-keyvault.vault.azure.net
environment_variables:
  PYTHONUNBUFFERED: "1"
command: >-
  python smoke_tracking.py
  --mlflow-url ${{inputs.mlflow_url}} --keyvault-url ${{inputs.keyvault_url}}
