$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# Smoke test of the parkwatch-train environment on gpu-cluster: builds the image and checks
# that PyTorch sees the T4 and that MLflow logs to the workspace.
display_name: smoke-parkwatch-train
experiment_name: parkwatch-smoke
compute: azureml:gpu-cluster
environment: azureml:parkwatch-train@latest
command: >-
  python -c "import torch, mlflow;
  print('torch', torch.__version__, 'cuda', torch.version.cuda);
  print('gpu', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '-');
  mlflow.log_metric('smoke', 1.0);
  print('mlflow ok')"
