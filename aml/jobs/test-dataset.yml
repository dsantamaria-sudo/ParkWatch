$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# Standalone test of check_dataset + build_dataset on cpu-cluster, outside the pipeline.
# It does not register the data asset (the pipeline does); the dataset stays as the job output.
# AZURE_CLIENT_ID (client id of parkwatch-identity) is passed at submission:
#   az ml job create -f aml/jobs/test-dataset.yml --set environment_variables.AZURE_CLIENT_ID=<id>
display_name: test-dataset
experiment_name: parkwatch-test
compute: azureml:cpu-cluster
environment: azureml:parkwatch-data@latest
code: ../../ml
inputs:
  rois:
    type: uri_file
    path: ../../label_studio/rois.json
  ls_url: https://park-watch-label-studio.salmonbay-c1ca7758.spaincentral.azurecontainerapps.io
  ls_project: 5
outputs:
  check:
    type: uri_folder
  dataset:
    type: uri_folder
command: >-
  python check_dataset.py
  --rois ${{inputs.rois}} --out ${{outputs.check}}
  --project ${{inputs.ls_project}} --ls-url ${{inputs.ls_url}}
  --keyvault-url https://parkwatch-keyvault.vault.azure.net
  && python build_dataset.py
  --rois ${{inputs.rois}} --export-dir ${{outputs.check}} --out ${{outputs.dataset}}
  --cache ./raw_cache
