$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# Smoke test of the parkwatch-data environment on cpu-cluster: builds the image and checks
# that the cluster identity can read the Key Vault and the Blob photos.
# AZURE_CLIENT_ID (client id of parkwatch-identity) is passed at submission:
#   az ml job create -f aml/jobs/smoke-data-env.yml --set environment_variables.AZURE_CLIENT_ID=<id>
display_name: smoke-parkwatch-data
experiment_name: parkwatch-smoke
compute: azureml:cpu-cluster
environment: azureml:parkwatch-data@latest
command: >-
  python -c "from azure.identity import ManagedIdentityCredential as M;
  from azure.keyvault.secrets import SecretClient as S;
  from azure.storage.blob import BlobServiceClient as B;
  import os; c = M(client_id=os.environ['AZURE_CLIENT_ID']);
  t = S('https://parkwatch-keyvault.vault.azure.net', c).get_secret('label-studio-token').value;
  print('keyvault ok, token chars:', len(t));
  blobs = B('https://parkwatch.blob.core.windows.net', credential=c).get_container_client('raw').list_blobs();
  print('blob ok, first:', next(iter(blobs)).name)"
