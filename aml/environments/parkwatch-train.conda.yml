name: parkwatch-train
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # The torch 2.7 PyPI wheels ship CUDA 12.6 (matches the base image).
      - torch==2.7.1
      - torchvision==0.22.1
      - mlflow==2.22.0
      - azureml-mlflow==1.60.0
      # self-hosted MLflow: the pipeline user's password comes from the Key Vault
      - azure-identity==1.23.0
      - azure-keyvault-secrets==4.9.0
      - numpy==2.2.6
      - pillow==11.2.1
      - matplotlib==3.10.3
